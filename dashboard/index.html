      // ── Conversation log ──
      function renderConvoLog() {
        const container = $("convo-entries");
        const log = currentLead?.conversation_log || [];
        const displayName = currentLead
          ? getLeadDisplayName(currentLead)
          : "Lead";

        // Build display entries — prepend form submission if applicable
        const entries = [];
        if (currentLead?.message) {
          const alreadyHasFormEntry = log.some(
            (e) =>
              e.text === currentLead.message ||
              e.tag === "Form submission" ||
              e.tag === "Inquiry",
          );
          if (!alreadyHasFormEntry) {
            entries.push({
              date: currentLead.created_at,
              from: "lead",
              text: currentLead.message,
              tag: "Inquiry",
            });
          }
        }
        entries.push(...log);

        // Update count badge
        $("convo-count").textContent = entries.length;

        if (!entries.length) {
          container.innerHTML = '<div class="convo-empty">No entries yet</div>';
          return;
        }

        container.innerHTML = entries
          .map((entry) => {
            const sender =
              entry.from === "roman"
                ? "You"
                : entry.from === "lead"
                  ? displayName
                  : "Note";
            const senderClass =
              entry.from === "roman"
                ? "roman"
                : entry.from === "lead"
                  ? "lead"
                  : "system";
            const tag = entry.tag || (entry.from ? "" : "Note");
            const t = tag.toLowerCase();
            const tagClass =
              t === "inquiry"
                ? "tag-inquiry"
                : t === "reply"
                  ? "tag-reply"
                  : t === "call"
                    ? "tag-call"
                    : t === "meeting"
                      ? "tag-meeting"
                      : t === "email"
                        ? "tag-email"
                        : t === "file"
                          ? "tag-file"
                          : t === "note"
                            ? "tag-note"
                            : "tag-default";

            // File entries render as a clickable link
            let bodyHtml;
            if (t === "file" && entry.file_url) {
              const fileName = (entry.text || "").replace(/^Uploaded:\s*/, "");
              bodyHtml = `<a href="${esc(entry.file_url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">${esc(fileName)}</a>`;
            } else {
              bodyHtml = linkify(entry.text);
            }

            return `<div class="convo-entry">
              <div class="convo-meta-row">
                <span class="convo-date">${formatShort(entry.date)}</span>
                <span class="convo-sender ${senderClass}">${esc(sender)}</span>
                ${tag ? `<span class="convo-tag-flat ${tagClass}">&middot; ${esc(tag.toLowerCase())}</span>` : ""}
              </div>
              <div class="convo-body">
                ${entry.subject ? `<div class="convo-subject">Subject: ${esc(entry.subject)}</div>` : ""}
                <div class="convo-text">${bodyHtml}</div>
                ${entry.status === "delivered" ? '<div class="convo-delivery-status delivered">\u2713\u2713 Delivered</div>' : entry.status === "sent" ? '<div class="convo-delivery-status sent">\u2713 Sent</div>' : entry.status === "bounced" ? '<div class="convo-delivery-status bounced">\u2717 Bounced</div>' : ""}
              </div>
            </div>`;
          })
          .join("");
        container.scrollTop = container.scrollHeight;
      }

      // ── Helpers ──
      function linkify(text) {
        return esc(text).replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">$1</a>',
        );
      }

      function flashSaved(elId) {
        const el = $(elId);
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 1500);
      }

      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str || "";
        return d.innerHTML;
      }

      function timeAgo(dateStr) {
        if (!dateStr) return "";
        const diff = Date.now() - new Date(dateStr).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        const days = Math.floor(hrs / 24);
        if (days < 30) return `${days}d ago`;
        const months = Math.floor(days / 30);
        return `${months}mo ago`;
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        return new Date(dateStr).toLocaleDateString("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatShort(dateStr) {
        if (!dateStr) return "";
        const d = new Date(dateStr);
        const day = d.getDate();
        const mon = d.toLocaleString("en-GB", { month: "short" });
        const h = String(d.getHours()).padStart(2, "0");
        const m = String(d.getMinutes()).padStart(2, "0");
        return `${day} ${mon} ${h}:${m}`;
      }

      // ──────────────────────────────────────────────────────────────
      // PR 48: Map view
      // ──────────────────────────────────────────────────────────────

      // Pulls each status colour from the existing CSS variables so the map
      // dots stay in sync with the Kanban column dots if the palette ever
      // changes. Falls back to a neutral grey if a status is unknown.
      function statusColour(status) {
        const css = getComputedStyle(document.documentElement);
        const v = (name) => css.getPropertyValue(name).trim() || "#888";
        const map = {
          new: v("--accent"),
          contacted: v("--info"),
          interested: v("--warning"),
          negotiating: v("--warning"),
          won: v("--success"),
          lost: v("--danger"),
        };
        return map[status] || v("--text-secondary");
      }

      const SPLIT_KEY = "starbot_dashboard_split_v1";
      const MAP_DEFAULT_RATIO = 0.55;
      const ACTIVE_STATUSES = ["new", "contacted", "interested", "negotiating"];
      const VENUE_TYPES = [
        "retail",
        "office",
        "hospitality",
        "shopping_centre",
        "gym",
        "transport_hub",
        "education",
        "other",
      ];

      const mapState = {
        map: null,
        cluster: null,
        markers: new Map(), // lead id -> marker
        geoLeads: [],
        noLocationLeads: [],
        filters: {
          status: new Set(ACTIVE_STATUSES),
          venueType: new Set(VENUE_TYPES),
          campaign: "",
          search: "",
        },
      };

      function applyStoredSplit() {
        const container = $("split-container");
        const mapPane = $("split-pane-map");
        if (!container || !mapPane) return;
        let ratio = parseFloat(localStorage.getItem(SPLIT_KEY));
        if (!Number.isFinite(ratio) || ratio < 0.15 || ratio > 0.85) {
          ratio = MAP_DEFAULT_RATIO;
        }
        const total = container.clientHeight;
        if (total > 0) {
          mapPane.style.height = Math.round(total * ratio) + "px";
        }
      }

      function setupSplit() {
        const handle = $("split-handle");
        const container = $("split-container");
        const mapPane = $("split-pane-map");
        if (!handle || !container || !mapPane) return;

        let dragging = false;
        const onMove = (clientY) => {
          if (!dragging) return;
          const rect = container.getBoundingClientRect();
          const y = clientY - rect.top;
          const min = 200;
          const max = rect.height - 200;
          const clamped = Math.max(min, Math.min(max, y));
          mapPane.style.height = clamped + "px";
          if (mapState.map) mapState.map.invalidateSize();
        };
        const onUp = () => {
          if (!dragging) return;
          dragging = false;
          handle.classList.remove("dragging");
          const ratio = mapPane.clientHeight / container.clientHeight;
          if (Number.isFinite(ratio)) {
            localStorage.setItem(SPLIT_KEY, ratio.toFixed(4));
          }
          window.removeEventListener("pointermove", pointerMove);
          window.removeEventListener("pointerup", onUp);
        };
        const pointerMove = (e) => onMove(e.clientY);

        handle.addEventListener("pointerdown", (e) => {
          dragging = true;
          handle.classList.add("dragging");
          e.preventDefault();
          window.addEventListener("pointermove", pointerMove);
          window.addEventListener("pointerup", onUp, { once: false });
        });

        window.addEventListener("resize", () => {
          if (mapState.map) mapState.map.invalidateSize();
        });
      }

      function setupMap() {
        if (mapState.map || !window.L) return;
        const el = $("leads-map");
        if (!el) return;
        const map = L.map(el, {
          zoomControl: true,
          attributionControl: true,
          worldCopyJump: false,
          maxBounds: [
            [49.5, -8.5],
            [61, 2],
          ],
          maxBoundsViscosity: 0.7,
        }).setView([54.5, -3.0], 6);

        // CartoDB Positron greyscale tiles — quieter base map that lets the
        // status-coloured dots carry the visual weight. {r} resolves to '@2x'
        // on hi-DPI screens.
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
          maxZoom: 19,
          attribution:
            '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, © <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: "abcd",
          crossOrigin: true,
        }).addTo(map);

        const cluster = L.markerClusterGroup({
          showCoverageOnHover: false,
          spiderfyOnMaxZoom: true,
          maxClusterRadius: 40,
        });
        map.addLayer(cluster);

        mapState.map = map;
        mapState.cluster = cluster;

        // Initial sizing pass once the pane has dimensions
        setTimeout(() => map.invalidateSize(), 50);
      }

      function buildMarker(lead) {
        const color = statusColour(lead.status || "new");
        const marker = L.circleMarker([lead.venue_lat, lead.venue_lng], {
          radius: 8,
          weight: 1,
          color: "#0a0e14",
          fillColor: color,
          fillOpacity: 0.85,
        });
        const meta = [
          lead.status,
          lead.venue_type ? lead.venue_type.replace(/_/g, " ") : null,
          lead.venue_postcode || null,
        ]
          .filter(Boolean)
          .join(" · ");
        marker.bindPopup(
          `<div class="pop-name">${escapeHtmlAttr(lead.name || "(no name)")}</div>` +
            (meta ? `<div class="pop-meta">${escapeHtmlAttr(meta)}</div>` : "")
        );
        marker.on("click", () => {
          openLeadModalById(lead.id);
        });
        return marker;
      }

      function escapeHtmlAttr(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function openLeadModalById(id) {
        let lead = leads.find((l) => l.id === id);
        if (!lead) {
          // Map data can include leads not yet in the kanban cache (e.g. a
          // recently inserted lead). Fall through to a one-row fetch.
          const { data } = await sb
            .from("starbot_leads")
            .select("*")
            .eq("id", id)
            .maybeSingle();
          if (!data) return;
          lead = data;
          leads.unshift(data);
        }
        openModal(lead);
      }

      function leadMatchesFilters(lead) {
        const s = mapState.filters.status;
        if (s.size > 0 && !s.has(lead.status || "new")) return false;
        const v = mapState.filters.venueType;
        if (lead.venue_type && v.size > 0 && !v.has(lead.venue_type)) return false;
        if (mapState.filters.campaign && lead.utm_campaign !== mapState.filters.campaign) {
          return false;
        }
        const q = mapState.filters.search.trim().toLowerCase();
        if (q) {
          const hay = `${lead.name || ""} ${lead.phone || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }

      function renderMarkers() {
        if (!mapState.cluster) return;
        mapState.cluster.clearLayers();
        mapState.markers.clear();
        for (const lead of mapState.geoLeads) {
          if (!leadMatchesFilters(lead)) continue;
          const m = buildMarker(lead);
          mapState.markers.set(lead.id, m);
          mapState.cluster.addLayer(m);
        }
      }

      function renderNoLocation() {
        const list = $("needs-location-list");
        const count = $("needs-location-count");
        if (!list || !count) return;
        const filtered = mapState.noLocationLeads.filter((l) => leadMatchesFilters(l));
        count.textContent = filtered.length;
        if (filtered.length === 0) {
          list.innerHTML =
            '<div class="needs-empty">All located. New leads without a postcode will appear here.</div>';
          return;
        }
        list.innerHTML = filtered
          .map((l) => {
            const status = l.venue_geocode_status || "no_postcode";
            return `<div class="needs-row" data-id="${escapeHtmlAttr(l.id)}">
              <div class="name">${escapeHtmlAttr(l.name || "(no name)")}
                <span class="needs-status-pill needs-status-${status}">${status.replace("_", " ")}</span>
              </div>
              <div class="meta">${escapeHtmlAttr([l.venue_type ? l.venue_type.replace(/_/g, " ") : null, l.status, l.venue_postcode || null].filter(Boolean).join(" · "))}</div>
            </div>`;
          })
          .join("");
        list.querySelectorAll(".needs-row").forEach((row) => {
          row.addEventListener("click", () => openLeadModalById(row.dataset.id));
        });
      }

      async function fetchGeoLeads() {
        try {
          const r = await fetch("/api/leads/geo", { cache: "no-store" });
          if (!r.ok) throw new Error(`geo ${r.status}`);
          const body = await r.json();
          mapState.geoLeads = body.leads || [];
        } catch (err) {
          console.error("fetchGeoLeads", err);
          mapState.geoLeads = [];
        }
      }

      async function fetchNoLocationLeads() {
        try {
          const r = await fetch("/api/leads/no-location", { cache: "no-store" });
          if (!r.ok) throw new Error(`no-location ${r.status}`);
          const body = await r.json();
          mapState.noLocationLeads = body.leads || [];
        } catch (err) {
          console.error("fetchNoLocationLeads", err);
          mapState.noLocationLeads = [];
        }
      }

      async function refreshMapData() {
        await Promise.all([fetchGeoLeads(), fetchNoLocationLeads()]);
        rebuildCampaignOptions();
        renderMarkers();
        renderNoLocation();
      }

      function rebuildCampaignOptions() {
        const sel = $("map-filter-campaign");
        if (!sel) return;
        const current = sel.value;
        const seen = new Set();
        for (const l of [...mapState.geoLeads, ...mapState.noLocationLeads]) {
          if (l.utm_campaign) seen.add(l.utm_campaign);
        }
        const sorted = [...seen].sort((a, b) => a.localeCompare(b));
        sel.innerHTML = '<option value="">Any campaign</option>' +
          sorted.map((c) => `<option value="${escapeHtmlAttr(c)}">${escapeHtmlAttr(c)}</option>`).join("");
        if (current && sorted.includes(current)) sel.value = current;
      }

      // Generic multi-select popover wired by id. Calls onChange after each tick.
      function setupMulti(rootId, label, allValues, selectedSet, onChange) {
        const root = $(rootId);
        if (!root) return;
        const toggle = root.querySelector(".multi-toggle");
        let menu = null;
        const updateLabel = () => {
          if (selectedSet.size === 0 || selectedSet.size === allValues.length) {
            toggle.textContent = `All ${label}`;
          } else if (selectedSet.size === 1) {
            toggle.textContent = [...selectedSet][0].replace(/_/g, " ");
          } else {
            toggle.textContent = `${selectedSet.size} ${label}`;
          }
        };
        updateLabel();

        const closeMenu = () => {
          if (menu) {
            menu.remove();
            menu = null;
            document.removeEventListener("click", outsideClick, true);
          }
        };
        const outsideClick = (e) => {
          if (menu && !menu.contains(e.target) && e.target !== toggle) closeMenu();
        };
        toggle.addEventListener("click", () => {
          if (menu) { closeMenu(); return; }
          menu = document.createElement("div");
          menu.className = "multi-menu";
          menu.innerHTML = allValues
            .map((v) => `<label class="opt"><input type="checkbox" value="${escapeHtmlAttr(v)}"${selectedSet.has(v) ? " checked" : ""}/><span>${escapeHtmlAttr(v.replace(/_/g, " "))}</span></label>`)
            .join("");
          menu.addEventListener("change", (e) => {
            const cb = e.target;
            if (cb && cb.matches('input[type="checkbox"]')) {
              if (cb.checked) selectedSet.add(cb.value);
              else selectedSet.delete(cb.value);
              updateLabel();
              onChange();
            }
          });
          root.appendChild(menu);
          setTimeout(() => document.addEventListener("click", outsideClick, true), 0);
        });
      }

      function setupFilters() {
        const refresh = () => {
          renderMarkers();
          renderNoLocation();
        };
        setupMulti("map-filter-status", "statuses",
          ["new", "contacted", "interested", "negotiating", "won", "lost"],
          mapState.filters.status, refresh);
        setupMulti("map-filter-venue", "venue",
          VENUE_TYPES, mapState.filters.venueType, refresh);
        const camp = $("map-filter-campaign");
        if (camp) camp.addEventListener("change", () => {
          mapState.filters.campaign = camp.value;
          refresh();
        });
        const search = $("map-filter-search");
        if (search) search.addEventListener("input", () => {
          mapState.filters.search = search.value || "";
          refresh();
        });
        const reset = $("map-filter-reset");
        if (reset) reset.addEventListener("click", () => {
          mapState.filters.status = new Set(ACTIVE_STATUSES);
          mapState.filters.venueType = new Set(VENUE_TYPES);
          mapState.filters.campaign = "";
          mapState.filters.search = "";
          if (camp) camp.value = "";
          if (search) search.value = "";
          // Re-paint the multi-toggle labels
          document.querySelectorAll(".multi-pop .multi-toggle").forEach((t) => {
            const root = t.parentElement;
            if (root.id === "map-filter-status") t.textContent = "All statuses";
            if (root.id === "map-filter-venue") t.textContent = "All venue";
          });
          refresh();
        });
      }

      function setupPostcodeForm() {
        const wrap = $("modal-postcode");
        const input = $("modal-postcode-input");
        const btn = $("modal-postcode-save");
        const status = $("modal-postcode-status");
        if (!wrap || !input || !btn) return;

        const setStatus = (kind, text) => {
          status.className = "status" + (kind ? " " + kind : "");
          status.textContent = text || "";
        };

        btn.addEventListener("click", async () => {
          if (!currentLead) return;
          const postcode = (input.value || "").trim();
          if (!postcode) {
            setStatus("failed", "Enter a postcode");
            return;
          }
          btn.disabled = true;
          setStatus("pending", "Locating…");
          try {
            const r = await fetch(`/api/leads/${encodeURIComponent(currentLead.id)}/postcode`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ postcode }),
            });
            if (!r.ok) {
              const body = await r.json().catch(() => ({}));
              if (r.status === 502) setStatus("failed", "Geocoder unavailable");
              else setStatus("failed", body.error || "Failed");
              return;
            }
            const result = await r.json();
            const ok = result.venue_geocode_status === "success";
            setStatus(ok ? "success" : "failed",
              ok ? "Located" : "Not found");
            Object.assign(currentLead, result);
            await refreshMapData();
            updatePostcodeFormForLead(currentLead);
          } catch (err) {
            console.error("postcode save", err);
            setStatus("failed", "Network error");
          } finally {
            btn.disabled = false;
          }
        });
      }

      // The modal calls this whenever it shows a lead, so the postcode input
      // reflects whatever state that lead is in (success / failed / pending /
      // no_postcode). Wraps the existing openModal call site without forking it.
      function updatePostcodeFormForLead(lead) {
        const wrap = $("modal-postcode");
        const input = $("modal-postcode-input");
        const status = $("modal-postcode-status");
        if (!wrap || !input || !status) return;
        // Always visible — manager may want to correct an existing postcode.
        wrap.hidden = false;
        input.value = lead.venue_postcode || "";
        const s = lead.venue_geocode_status || "no_postcode";
        status.className = "status " + (s === "success" ? "success" : s === "failed" ? "failed" : s === "pending" ? "pending" : "");
        status.textContent = s === "success"
          ? "Located"
          : s === "failed"
          ? "Not found"
          : s === "pending"
          ? "Pending"
          : "";
      }

      // Hook into the existing openModal so the postcode form follows the
      // currently shown lead. We wrap rather than edit to keep diff small.
      const _origOpenModal = openModal;
      openModal = function (lead) {
        _origOpenModal(lead);
        updatePostcodeFormForLead(lead);
      };

      async function initMapView() {
        applyStoredSplit();
        setupSplit();
        setupMap();
        setupFilters();
        setupPostcodeForm();
        await refreshMapData();
      }

      // ── Boot ──
      (async () => {
        await init();
        // Map view requires the dashboard to be visible (post-auth). Wait
        // until #dashboard loses .hidden before initialising Leaflet so the
        // map container has real dimensions.
        const dash = $("dashboard");
        if (dash && dash.classList.contains("hidden")) {
          const obs = new MutationObserver(() => {
            if (!dash.classList.contains("hidden")) {
              obs.disconnect();
              initMapView();
            }
          });
          obs.observe(dash, { attributes: true, attributeFilter: ["class"] });
        } else {
          initMapView();
        }
      })();
    </script>
  </body>
</html>
