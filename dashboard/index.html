            (l) => (l.status || "new") === stage.id,
          );

          col.innerHTML = `
          <div class="column-header">
            <span class="column-dot ${stage.dot}"></span>
            ${stage.label}
            <span class="column-count">${stageLeads.length}</span>
          </div>
        `;

          const cardsContainer = document.createElement("div");
          cardsContainer.className = "column-cards";
          cardsContainer.dataset.status = stage.id;

          stageLeads.forEach((lead) => {
            cardsContainer.appendChild(createCard(lead));
          });

          col.appendChild(cardsContainer);
          boardEl.appendChild(col);

          // SortableJS
          new Sortable(cardsContainer, {
            group: "kanban",
            animation: 180,
            ghostClass: "sortable-ghost",
            dragClass: "sortable-drag",
            easing: "cubic-bezier(0.16, 1, 0.3, 1)",
            onStart: () => {
              document
                .querySelectorAll(".column-cards")
                .forEach((c) => c.classList.add("column-cards-active"));
            },
            onEnd: async (evt) => {
              document
                .querySelectorAll(".column-cards")
                .forEach((c) => c.classList.remove("column-cards-active"));
              const leadId = evt.item.dataset.id;
              const newStatus = evt.to.dataset.status;
              const lead = leads.find((l) => l.id === leadId);
              if (!lead || lead.status === newStatus) return;

              // Optimistic update
              lead.status = newStatus;
              updateCount();

              // Persist
              const { error } = await sb
                .from("starbot_leads")
                .update({ status: newStatus })
                .eq("id", leadId);

              if (error) {
                console.error("Failed to update status:", error);
                lead.status = evt.from.dataset.status;
                buildBoard();
              }
            },
          });
        });
      }

      function createCard(lead) {
        const card = document.createElement("div");
        card.className = "card";
        card.dataset.id = lead.id;

        const displayName =
          lead.name ||
          [lead.first_name, lead.last_name].filter(Boolean).join(" ") ||
          "Unknown";
        const status = lead.status || "new";

        // Attention indicators
        const unread =
          !lead.last_viewed_at ||
          (lead.last_activity_at &&
            new Date(lead.last_activity_at) > new Date(lead.last_viewed_at));

        const ACTIVE_STAGES = ["new", "contacted", "interested", "negotiating"];
        const THREE_DAYS_MS = 3 * 24 * 60 * 60 * 1000;
        const stale =
          ACTIVE_STAGES.includes(status) &&
          lead.last_activity_at &&
          Date.now() - new Date(lead.last_activity_at).getTime() > THREE_DAYS_MS;

        if (stale) card.classList.add("card-stale");

        card.innerHTML = `
        ${unread ? '<div class="card-unread-dot"></div>' : ""}
        <div class="card-company">${esc(lead.company || "No company")}</div>
        <div class="card-contact">${esc(displayName)}${lead.role ? " &middot; " + esc(lead.role) : ""}</div>
        <div class="card-footer">
          <span class="card-time">${timeAgo(lead.created_at)}</span>
          <span class="status-pill status-${status}">${status}</span>
        </div>
      `;

        card.addEventListener("click", (e) => {
          if (e.target.closest(".sortable-drag")) return;
          openModal(lead);
        });

        return card;
      }

      // ── Kanban filters ──
      // PR 49: the old #filter-status and #search-input lived in the now-
      // removed topbar. The Pipeline view uses the unfiltered leads array.
      // Map filtering is handled by the floating left panel via setupFilters().
      const _filterStatusEl = $("filter-status");
      const _searchInputEl = $("search-input");
      if (_filterStatusEl) {
        _filterStatusEl.addEventListener("change", (e) => {
          filterStatus = e.target.value;
          buildBoard();
        });
      }
      if (_searchInputEl) {
        _searchInputEl.addEventListener("input", (e) => {
          searchQuery = e.target.value.trim();
          buildBoard();
        });
      }

      // ── Modal ──
      // ── Pipeline stage order ──
      const STAGE_ORDER = [
        "new",
        "contacted",
        "interested",
        "negotiating",
        "won",
      ];

      function getNextStage(status) {
        const idx = STAGE_ORDER.indexOf(status || "new");
        if (idx < 0 || idx >= STAGE_ORDER.length - 1) return null;
        return STAGE_ORDER[idx + 1];
      }

      function getLeadDisplayName(lead) {
        return (
          lead.name ||
          [lead.first_name, lead.last_name].filter(Boolean).join(" ") ||
          "Unknown"
        );
      }

      function openModal(lead) {
        currentLead = lead;
        const displayName = getLeadDisplayName(lead);
        const status = lead.status || "new";

        $("modal-company").textContent = lead.company || "No company";
        $("modal-contact").textContent =
          `${displayName}${lead.role ? " \u00B7 " + lead.role : ""}`;

        // Pills: status + channel + campaign
        const pills = [];
        pills.push(
          `<span class="modal-pill status-pill status-${status}">${status}</span>`,
        );
        if (lead.utm_source) {
          pills.push(
            `<span class="modal-pill channel">${esc(lead.utm_source)}</span>`,
          );
        }
        if (lead.utm_campaign) {
          pills.push(
            `<span class="modal-pill channel">${esc(lead.utm_campaign)}</span>`,
          );
        }
        $("modal-pills").innerHTML = pills.join("");

        // Contact row: email · phone · source
        const contactParts = [];
        if (lead.email) {
          contactParts.push(
            `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>` +
              `<a href="mailto:${esc(lead.email)}">${esc(lead.email)}</a>`,
          );
        }
        if (lead.phone) {
          if (lead.email)
            contactParts.push('<span class="sep">&middot;</span>');
          // PR 47: formatted display + icon buttons (tel: + copy)
          const display = formatPhoneIntl(lead.phone_e164 || lead.phone);
          const telTarget = lead.phone_e164 || lead.phone;
          contactParts.push(
            `<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>` +
              `<a href="tel:${esc(telTarget)}">${esc(display)}</a>` +
              `<span class="phone-actions">` +
                `<button type="button" data-phone-tel="${esc(telTarget)}" title="Call"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg></button>` +
                `<button type="button" data-phone-copy="${esc(telTarget)}" title="Copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>` +
              `</span>`,
          );
        }
        if (lead.source) {
          if (lead.email || lead.phone)
            contactParts.push('<span class="sep">&middot;</span>');
          contactParts.push(
            `<span style="color:var(--text-tertiary)">via ${esc(lead.source)}</span>`,
          );
        }
        $("modal-contact-row").innerHTML = contactParts.join(" ");

        // Qualification (hide if all 3 values empty — pre-quiz leads)
        const hasQual =
          lead.location_type || lead.coffee_timeline || lead.london_zone;
        $("qualification-section").hidden = !hasQual;
        if (hasQual) {
          $("qual-location").textContent = lead.location_type || "—";
          $("qual-timeline").textContent = lead.coffee_timeline || "—";
          $("qual-zone").textContent = lead.london_zone || "—";
        }

        // Notes (collapsed by default)
        $("modal-notes").value = lead.notes || "";
        $("notes-content").classList.remove("open");
        $("notes-chevron").classList.remove("open");

        // Conversation
        renderConvoLog();

        // Compose: reset and show/hide buttons based on contact info
        $("compose-text").value = "";
        $("compose-subject").value = "Re: Starbot Partnership";
        $("compose-subject-row").classList.add("hidden");
        $("btn-send-email").classList.toggle("hidden", !lead.email);
        $("log-type").value = "note";
        $("action-email").classList.toggle("hidden", !lead.email);
        updateComposeButtons();

        // Next stage button
        const next = getNextStage(status);
        const nextBtn = $("action-next");
        if (next && status !== "lost") {
          nextBtn.textContent = `${next.charAt(0).toUpperCase() + next.slice(1)} \u2192`;
          nextBtn.classList.remove("hidden");
        } else {
          nextBtn.classList.add("hidden");
        }

        // Created date in footer
        $("modal-created").textContent = formatDate(lead.created_at);

        // Mark as viewed (fire-and-forget)
        const viewedAt = new Date().toISOString();
        lead.last_viewed_at = viewedAt;
        sb.from("starbot_leads")
          .update({ last_viewed_at: viewedAt })
          .eq("id", lead.id)
          .then(({ error }) => {
            if (error) console.error("Failed to update last_viewed_at:", error);
          });

        // Show modal
        modalBackdrop.classList.add("open");
        document.body.style.overflow = "hidden";
      }

      function closeModal() {
        modalBackdrop.classList.remove("open");
        document.body.style.overflow = "";
        currentLead = null;
      }

      $("modal-close").addEventListener("click", closeModal);
      $("action-close-btn").addEventListener("click", closeModal);
      modalBackdrop.addEventListener("click", (e) => {
        if (e.target === modalBackdrop) closeModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeModal();
      });

      // UTM toggle
      // Notes toggle
      $("notes-toggle").addEventListener("click", () => {
        $("notes-content").classList.toggle("open");
        $("notes-chevron").classList.toggle("open");
      });

      // Notes auto-save on blur
      $("modal-notes").addEventListener("blur", async () => {
        if (!currentLead) return;
        const notes = $("modal-notes").value;
        if (notes === (currentLead.notes || "")) return;

        currentLead.notes = notes;
        const { error } = await sb
          .from("starbot_leads")
          .update({ notes })
          .eq("id", currentLead.id);

        if (!error) flashSaved("notes-saved");
        else console.error("Failed to save notes:", error);
      });

      // ── Next stage button ──
      $("action-next").addEventListener("click", async () => {
        if (!currentLead) return;
        const next = getNextStage(currentLead.status);
        if (!next) return;

        currentLead.status = next;
        const { error } = await sb
          .from("starbot_leads")
          .update({ status: next })
          .eq("id", currentLead.id);

        if (!error) {
          buildBoard();
          const nextBtn = $("action-next");
          const newNext = getNextStage(next);
          $("modal-pills").querySelector(".status-pill").className =
            `modal-pill status-pill status-${next}`;
          $("modal-pills").querySelector(".status-pill").textContent = next;
          if (newNext && next !== "lost") {
            nextBtn.textContent = `${newNext.charAt(0).toUpperCase() + newNext.slice(1)} \u2192`;
          } else {
            nextBtn.classList.add("hidden");
          }
        } else {
          console.error("Failed to advance status:", error);
        }
      });

      // ── Delete button ──
      $("action-delete").addEventListener("click", async () => {
        if (!currentLead) return;
        if (!confirm("Delete this lead permanently? This cannot be undone."))
          return;

        const { error } = await sb
          .from("starbot_leads")
          .delete()
          .eq("id", currentLead.id);

        if (!error) {
          leads = leads.filter((l) => l.id !== currentLead.id);
          closeModal();
          buildBoard();
        } else {
          console.error("Failed to delete lead:", error);
        }
      });

      // ── Email shortcut in action bar ──
      $("action-email").addEventListener("click", () => {
        const compose = $("compose-text");
        compose.scrollIntoView({ behavior: "smooth", block: "center" });
        $("compose-subject-row").classList.remove("hidden");
        setTimeout(() => compose.focus(), 300);
      });

      // ── Compose ──
      function updateComposeButtons() {
        const hasText = $("compose-text").value.trim().length > 0;
        $("btn-log").disabled = !hasText;
        $("btn-send-email").disabled = !hasText;

      // ── File upload ──

      // ──────────────────────────────────────────────────────────────
      // PR 47: phone format, log-call form, activity timeline
      // ──────────────────────────────────────────────────────────────

      // Small UK-aware international phone formatter. Accepts E.164 or raw
      // input; returns spaced form like '+44 7970 394918' for display only.
      // Lookups + comparisons should always use the canonical phone_e164.
      function formatPhoneIntl(raw) {
        if (!raw) return "";
        const cleaned = String(raw).replace(/[^\d+]/g, "");
        const e164 = cleaned.startsWith("+") ? cleaned : "+" + cleaned;
        if (!/^\+\d{6,15}$/.test(e164)) return raw;
        if (e164.startsWith("+44")) {
          const rest = e164.slice(3);
          if (rest.length === 10 && rest.startsWith("7")) {
            return `+44 ${rest.slice(0, 4)} ${rest.slice(4, 7)} ${rest.slice(7)}`;
          }
          if (rest.length === 10 && rest.startsWith("20")) {
            return `+44 20 ${rest.slice(2, 6)} ${rest.slice(6)}`;
          }
          return `+44 ${rest.replace(/(\d{3})(?=\d)/g, "$1 ")}`;
        }
        return e164.replace(/^(\+\d{1,3})(\d+)/, (_, cc, rest) =>
          `${cc} ${rest.replace(/(\d{3})(?=\d)/g, "$1 ")}`
        );
      }

      // Click handlers for phone-actions inside the modal contact row.
      // Delegated to the modal body so re-rendering doesn't lose bindings.
      $("modal").addEventListener("click", (e) => {
        const tel = e.target.closest && e.target.closest("[data-phone-tel]");
        if (tel) {
          const num = tel.getAttribute("data-phone-tel");
          if (num) window.location.href = `tel:${num}`;
          return;
        }
        const cp = e.target.closest && e.target.closest("[data-phone-copy]");
        if (cp) {
          const num = cp.getAttribute("data-phone-copy");
          if (num && navigator.clipboard) {
            navigator.clipboard.writeText(num).then(
              () => showToast(`Copied ${num}`),
              () => showToast("Copy failed")
            );
          } else if (num) {
            // Fallback for older browsers
            const ta = document.createElement("textarea");
            ta.value = num;
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand("copy"); showToast(`Copied ${num}`); }
            catch { showToast("Copy failed"); }
            ta.remove();
          }
        }
      });

      function showToast(text) {
        let el = document.getElementById("starbot-toast");
        if (!el) {
          el = document.createElement("div");
          el.id = "starbot-toast";
          el.className = "toast";
          document.body.appendChild(el);
        }
        el.textContent = text;
        el.classList.add("show");
        clearTimeout(showToast._t);
        showToast._t = setTimeout(() => el.classList.remove("show"), 1600);

      // ── Log-call form ──
      const lcForm = $("log-call-form");
      const lcDir = $("lc-direction");
      const lcOutcome = $("lc-outcome");
      const lcDurationRow = $("lc-duration-row");
      const lcDuration = $("lc-duration");
      const lcNotes = $("lc-notes");
      const lcSave = $("lc-save");
      const lcCancel = $("lc-cancel");

      function lcReset() {
        lcDir.querySelectorAll("button").forEach((b) =>
          b.classList.toggle("on", b.dataset.value === "outbound")
        );
        lcOutcome.value = "answered";
        lcDuration.value = "";
        lcNotes.value = "";
        lcUpdateDurationVisibility();
      }
      function lcOpen() {
        lcReset();
        lcForm.hidden = false;
        setTimeout(() => lcOutcome.focus(), 0);
      }
      function lcClose() {
        lcForm.hidden = true;
      }
      function lcDirectionValue() {
        const on = lcDir.querySelector("button.on");
        return on ? on.dataset.value : "outbound";
      }
      function lcUpdateDurationVisibility() {
        lcDurationRow.style.display = lcOutcome.value === "answered" ? "" : "none";
      }
      function parseDurationToSeconds(s) {
        if (!s) return null;
        const t = String(s).trim();
        if (!t) return null;
        if (/^\d+$/.test(t)) {
          const n = Number(t);
          return Number.isInteger(n) && n >= 0 ? n : NaN;
        }
        const m = t.match(/^(\d{1,2}):([0-5]?\d)$/);
        if (!m) return NaN;
        return Number(m[1]) * 60 + Number(m[2]);
      }
      lcDir.addEventListener("click", (e) => {
        const b = e.target.closest("button[data-value]");
        if (!b) return;
        lcDir.querySelectorAll("button").forEach((x) => x.classList.remove("on"));
        b.classList.add("on");
      });
      lcOutcome.addEventListener("change", lcUpdateDurationVisibility);
      lcCancel.addEventListener("click", lcClose);
      $("action-log-call").addEventListener("click", () => {
        if (!currentLead) return;
        if (lcForm.hidden) lcOpen();
        else lcClose();
      });
      lcSave.addEventListener("click", async () => {
        if (!currentLead) return;
        const direction = lcDirectionValue();
        const outcome = lcOutcome.value;
        let duration_seconds = null;
        if (outcome === "answered" && lcDuration.value.trim()) {
          const parsed = parseDurationToSeconds(lcDuration.value);
          if (parsed === null || Number.isNaN(parsed)) {
            showToast("Invalid duration");
            return;
          }
          duration_seconds = parsed;
        }
        const notes = lcNotes.value.trim() || null;
        lcSave.disabled = true;
        try {
          const { data: { session } } = await sb.auth.getSession();
          const r = await fetch(`/api/leads/${encodeURIComponent(currentLead.id)}/call-log`, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(session?.access_token
                ? { Authorization: `Bearer ${session.access_token}` }
                : {}),
            },
            body: JSON.stringify({ direction, outcome, duration_seconds, notes }),
          });
          if (!r.ok) {
            const body = await r.json().catch(() => ({}));
            showToast(body.error || `Failed (${r.status})`);
            return;
          }
          lcClose();
          await refreshActivityTimeline();
        } catch (err) {
          console.error("log-call save", err);
          showToast("Network error");
        } finally {
          lcSave.disabled = false;
        }
      });

      // ── Activity timeline ──
      let timelineFilter = "all";

      $("timeline-filters").addEventListener("click", (e) => {
        const chip = e.target.closest("button[data-filter]");
        if (!chip) return;
        timelineFilter = chip.dataset.filter;
        $("timeline-filters")
          .querySelectorAll(".timeline-chip")
          .forEach((c) => c.classList.toggle("on", c === chip));
        renderTimelineFromState();
      });

      let timelineCache = []; // last fetched feed; filter is client-side
      async function refreshActivityTimeline() {
        if (!currentLead) return;
        const container = $("convo-entries");
        const id = currentLead.id;
        try {
          const r = await fetch(`/api/leads/${encodeURIComponent(id)}/activity`, {
            cache: "no-store",
          });
          if (!r.ok) {
            console.error("activity fetch failed", r.status);
            // Fall through to the legacy conversation_log renderer so the
            // modal still shows something on a transient API blip.
            return legacyRenderConvoLog();
          }
          const body = await r.json();
          timelineCache = Array.isArray(body.activity) ? body.activity : [];
          renderTimelineFromState();
        } catch (err) {
          console.error("activity fetch threw", err);
          legacyRenderConvoLog();
        }
      }

      function renderTimelineFromState() {
        const container = $("convo-entries");
        const items = timelineCache.filter(matchTimelineFilter);
        $("convo-count").textContent = items.length;
        if (items.length === 0) {
          container.innerHTML = '<div class="timeline-empty">No activity yet</div>';
          return;
        }
        container.innerHTML = items.map(renderTimelineItem).join("");
        container.scrollTop = 0;
        // Click-to-expand
        container.querySelectorAll(".timeline-item").forEach((row) => {
          row.addEventListener("click", () => {
            const det = row.querySelector(".timeline-detail");
            if (det) det.style.display = det.style.display === "none" ? "" : "none";
          });
        });
      }

      function matchTimelineFilter(item) {
        if (timelineFilter === "all") return true;
        if (timelineFilter === "calls") return item.type === "call";
        if (timelineFilter === "emails")
          return item.type === "email_outbound" || item.type === "email_inbound";
        if (timelineFilter === "notes")
          return item.type === "note" || item.type === "file";
        if (timelineFilter === "status")
          return item.type === "status_change" || item.type === "form_submission";
        return true;
      }

      function renderTimelineItem(item) {
        const { type, timestamp, payload = {} } = item;
        const ts = timestamp ? new Date(timestamp) : null;
        const when = ts ? formatTimelineTime(ts) : "";
        const icon = timelineIconFor(type);
        const { summary, detail } = timelineCopyFor(type, payload);
        const detailHidden = detail ? "" : " hidden";
        return `<div class="timeline-item t-${type}" data-id="${esc(item.id || "")}">
          <span class="timeline-icon">${icon}</span>
          <div class="timeline-main">
            <div class="timeline-summary">
              <span class="subj">${summary}</span>
              <span class="when" title="${ts ? ts.toISOString() : ""}">${esc(when)}</span>
            </div>
            <div class="timeline-detail" style="display:none"${detailHidden}>${detail || ""}</div>
          </div>
        </div>`;
      }

      function formatTimelineTime(d) {
        const diffMs = Date.now() - d.getTime();
        const m = Math.floor(diffMs / 60000);
        if (m < 1) return "just now";
        if (m < 60) return `${m}m ago`;
        const h = Math.floor(m / 60);
        if (h < 24) return `${h}h ago`;
        return formatShort(d.toISOString());
      }

      function timelineIconFor(type) {
        const svg = (path) =>
          `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${path}</svg>`;
        switch (type) {
          case "call":
            return svg('<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/>');
          case "email_outbound":
          case "email_inbound":
            return svg('<rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>');
          case "note":
            return svg('<path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/>');
          case "file":
            return svg('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>');
          case "form_submission":
            return svg('<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 12l2 2 4-4"/>');
          case "status_change":
            return svg('<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>');
          case "whatsapp_inbound":
          case "whatsapp_outbound":
            return svg('<path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/>');
          default:
            return svg('<circle cx="12" cy="12" r="9"/>');
        }
      }

      function timelineCopyFor(type, payload) {
        switch (type) {
          case "form_submission": {
            const src = payload.source || "landing_page";
            return {
              summary: `Form submitted via ${esc(src)}`,
              detail: payload.utm_campaign
                ? `<div>Campaign: ${esc(payload.utm_campaign)}</div>`
                : "",
            };
          }
          case "status_change": {
            const from = payload.from_status || "new";
            const to = payload.to_status || "";
            return {
              summary: `${esc(from)} → ${esc(to)}`,
              detail: "",
            };
          }
          case "email_outbound":
          case "email_inbound": {
            const subject = payload.subject || "(no subject)";
            const text = payload.text || "";
            const subj = `${type === "email_inbound" ? "← " : "→ "}${esc(subject)}`;
            const body = linkify(text);
            return {
              summary: subj,
              detail: `<div class="subj">${esc(subject)}</div>${body}`,
            };
          }
          case "note": {
            const text = payload.text || "";
            const firstLine = text.split(/\r?\n/, 1)[0] || "(empty note)";
            return {
              summary: esc(firstLine),
              detail: linkify(text),
            };
          }
          case "file": {
            const fileText = payload.text || "(file)";
            return { summary: esc(fileText), detail: "" };
          }
          case "call": {
            const dir = payload.direction === "inbound" ? "Inbound" : "Outbound";
            const outcome = (payload.outcome || "").replace(/_/g, " ");
            const dur =
              typeof payload.duration_seconds === "number"
                ? `, ${Math.floor(payload.duration_seconds / 60)}m ${payload.duration_seconds % 60}s`
                : "";
            return {
              summary: `${dir} call, ${esc(outcome)}${esc(dur)}`,
              detail: payload.notes ? linkify(payload.notes) : "",
            };
          }
          case "whatsapp_inbound":
          case "whatsapp_outbound": {
            const body = payload.body || "";
            const arrow = type === "whatsapp_inbound" ? "← " : "→ ";
            return {
              summary: arrow + esc(body.slice(0, 60)),
              detail: linkify(body),
            };
          }
          default:
            return { summary: esc(type), detail: "" };
        }
      }

      // Legacy fallback: kept verbatim from earlier so a transient activity
      // endpoint failure still renders something. The body of the original
      // renderConvoLog is moved here.
      function legacyRenderConvoLog() {
        const container = $("convo-entries");
        const log = currentLead?.conversation_log || [];
        const displayName = currentLead
          ? getLeadDisplayName(currentLead)
          : "Lead";

        // Build display entries — prepend form submission if applicable
        const entries = [];
        if (currentLead?.message) {
          const alreadyHasFormEntry = log.some(
            (e) =>
              e.text === currentLead.message ||
              e.tag === "Form submission" ||
              e.tag === "Inquiry",
          );
          if (!alreadyHasFormEntry) {
            entries.push({
              date: currentLead.created_at,
              from: "lead",
              text: currentLead.message,
              tag: "Inquiry",
            });
          }
        }
        entries.push(...log);

        // Update count badge
        $("convo-count").textContent = entries.length;

        if (!entries.length) {
          container.innerHTML = '<div class="convo-empty">No entries yet</div>';
          return;
        }

        container.innerHTML = entries
          .map((entry) => {
            const sender =
              entry.from === "roman"
                ? "You"
                : entry.from === "lead"
                  ? displayName
                  : "Note";
            const senderClass =
              entry.from === "roman"
                ? "roman"
                : entry.from === "lead"
                  ? "lead"
                  : "system";
            const tag = entry.tag || (entry.from ? "" : "Note");
            const t = tag.toLowerCase();
            const tagClass =
              t === "inquiry"
                ? "tag-inquiry"
                : t === "reply"
                  ? "tag-reply"
                  : t === "call"
                    ? "tag-call"
                    : t === "meeting"
                      ? "tag-meeting"
                      : t === "email"
                        ? "tag-email"
                        : t === "file"
                          ? "tag-file"
                          : t === "note"
                            ? "tag-note"
                            : "tag-default";

            // File entries render as a clickable link
            let bodyHtml;
            if (t === "file" && entry.file_url) {
              const fileName = (entry.text || "").replace(/^Uploaded:\s*/, "");
              bodyHtml = `<a href="${esc(entry.file_url)}" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">${esc(fileName)}</a>`;
            } else {
              bodyHtml = linkify(entry.text);
            }

            return `<div class="convo-entry">
              <div class="convo-meta-row">
                <span class="convo-date">${formatShort(entry.date)}</span>
                <span class="convo-sender ${senderClass}">${esc(sender)}</span>
                ${tag ? `<span class="convo-tag-flat ${tagClass}">&middot; ${esc(tag.toLowerCase())}</span>` : ""}
              </div>
              <div class="convo-body">
                ${entry.subject ? `<div class="convo-subject">Subject: ${esc(entry.subject)}</div>` : ""}
                <div class="convo-text">${bodyHtml}</div>
                ${entry.status === "delivered" ? '<div class="convo-delivery-status delivered">\u2713\u2713 Delivered</div>' : entry.status === "sent" ? '<div class="convo-delivery-status sent">\u2713 Sent</div>' : entry.status === "bounced" ? '<div class="convo-delivery-status bounced">\u2717 Bounced</div>' : ""}
              </div>
            </div>`;
          })
          .join("");
        container.scrollTop = container.scrollHeight;
      }

      // Public name kept for the existing call sites (openModal, send-email
      // success, note save, file upload, etc.). All of them now drive the
      // unified timeline; the legacy renderer above is only used as a
      // transient-failure fallback inside refreshActivityTimeline.
      function renderConvoLog() {
        refreshActivityTimeline();
      }

      // ── Helpers ──
      function linkify(text) {
        return esc(text).replace(
          /(https?:\/\/[^\s<]+)/g,
          '<a href="$1" target="_blank" rel="noopener" style="color:var(--accent);text-decoration:none;">$1</a>',
        );
      }

      function flashSaved(elId) {
        const el = $(elId);
        el.classList.add("show");
        setTimeout(() => el.classList.remove("show"), 1500);
      }

      function esc(str) {
        const d = document.createElement("div");
        d.textContent = str || "";
        return d.innerHTML;
      }

      function timeAgo(dateStr) {
        if (!dateStr) return "";
        const diff = Date.now() - new Date(dateStr).getTime();
        const mins = Math.floor(diff / 60000);
        if (mins < 1) return "just now";
        if (mins < 60) return `${mins}m ago`;
        const hrs = Math.floor(mins / 60);
        if (hrs < 24) return `${hrs}h ago`;
        const days = Math.floor(hrs / 24);
        if (days < 30) return `${days}d ago`;
        const months = Math.floor(days / 30);
        return `${months}mo ago`;
      }

      function formatDate(dateStr) {
        if (!dateStr) return "";
        return new Date(dateStr).toLocaleDateString("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
          hour: "2-digit",
          minute: "2-digit",
        });
      }

      function formatShort(dateStr) {
        if (!dateStr) return "";
        const d = new Date(dateStr);
        const day = d.getDate();
        const mon = d.toLocaleString("en-GB", { month: "short" });
        const h = String(d.getHours()).padStart(2, "0");
        const m = String(d.getMinutes()).padStart(2, "0");
        return `${day} ${mon} ${h}:${m}`;
      }

      // ──────────────────────────────────────────────────────────────
      // PR 48: Map view
      // ──────────────────────────────────────────────────────────────

      // PR 50: 3-colour traffic-light scheme for map dots.
      //   green  = won
      //   amber  = new / contacted / interested / negotiating (any active stage)
      //   red    = lost / dead / cold
      // Colours pull from the brand CSS variables (--success #22c55e,
      // --warning #fbbf24, --danger #f87171) so the map stays in sync if the
      // palette ever shifts. Kanban status pills keep their per-stage colours
      // — only the map collapses the 6 stages into the 3-colour traffic light.
      function statusColour(status) {
        const css = getComputedStyle(document.documentElement);
        const v = (name) => css.getPropertyValue(name).trim() || "#888";
        if (status === "won") return v("--success");
        if (status === "lost" || status === "dead" || status === "cold") {
          return v("--danger");
        }
        // Any other status (including unknown / null) is treated as in-play.
        return v("--warning");
      }

      // PR 49: localStorage keys for the new command-dashboard layout
      const LAYERS_KEY = "starbot_active_layers_v1";
      const LEFT_PANEL_KEY = "starbot_filters_panel_v1";
      const RIGHT_PANEL_KEY = "starbot_needs_location_panel_v1";
      const VIEW_KEY = "starbot_dashboard_view_v1";

      const ACTIVE_STATUSES = ["new", "contacted", "interested", "negotiating"];
      const VENUE_TYPES = [
        "retail",
        "office",
        "hospitality",
        "shopping_centre",
        "gym",
        "transport_hub",
        "education",
        "other",
      ];

      const mapState = {
        map: null,
        cluster: null,
        markers: new Map(), // lead id -> marker
        geoLeads: [],
        noLocationLeads: [],
        filters: {
          status: new Set(ACTIVE_STATUSES),
          venueType: new Set(VENUE_TYPES),
          campaign: "",
          search: "",
        },
      };

      // ── PR 49: layer toggle registry ──
      // Each entry: { label, hint, isActive, disabled, icon (SVG path),
      //   render() / clear() }. Click handlers flip isActive and call the
      //   render or clear hook. Future PRs (50-53) add their own entries.
      const layerRegistry = {
        leads: {
          label: "Leads",
          hint: "",
          isActive: true,
          disabled: false,
          icon: '<path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/>',
          render: () => renderMarkers(),
          clear: () => {
            if (mapState.cluster) mapState.cluster.clearLayers();
            mapState.markers.clear();
          },
        },
        deployed_starbots: {
          label: "Deployed Starbots",
          hint: "Coming in PR 50",
          isActive: false,
          disabled: true,
          icon: '<rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="8" cy="16" r="1.5"/><circle cx="16" cy="16" r="1.5"/><path d="M12 7v4"/><circle cx="12" cy="5" r="2"/>',
          render: () => {},
          clear: () => {},
        },
        target_locations: {
          label: "Target Locations",
          hint: "Coming in PR 51",
          isActive: false,
          disabled: true,
          icon: '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><line x1="12" y1="2" x2="12" y2="6"/><line x1="12" y1="18" x2="12" y2="22"/>',
          render: () => {},
          clear: () => {},
        },
        population: {
          label: "Population",
          hint: "Coming in PR 52",
          isActive: false,
          disabled: true,
          icon: '<circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5"/><path d="M14 19c0-2 2-4 4-4s4 2 4 4"/>',
          render: () => {},
          clear: () => {},
        },
        traffic: {
          label: "Traffic",
          hint: "Coming in PR 53",
          isActive: false,
          disabled: true,
          icon: '<line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="14" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/>',
          render: () => {},
          clear: () => {},
        },
      };

      function loadStoredLayers() {
        try {
          const raw = localStorage.getItem(LAYERS_KEY);
          if (!raw) return;
          const set = new Set(JSON.parse(raw));
          for (const id of Object.keys(layerRegistry)) {
            if (layerRegistry[id].disabled) continue;
            layerRegistry[id].isActive = set.has(id);
          }
        } catch {
          // ignore malformed payload
        }
      }
      function storeActiveLayers() {
        const ids = Object.keys(layerRegistry).filter(
          (id) => !layerRegistry[id].disabled && layerRegistry[id].isActive
        );
        localStorage.setItem(LAYERS_KEY, JSON.stringify(ids));
      }

      function renderLayerBar() {
        const bar = $("cmd-layer-bar");
        if (!bar) return;
        bar.innerHTML = Object.entries(layerRegistry)
          .map(([id, l]) => {
            const onClass = l.isActive && !l.disabled ? " on" : "";
            const dis = l.disabled ? " disabled" : "";
            const tip = l.hint
              ? `<span class="cmd-layer-tooltip">${esc(l.hint)}</span>`
              : "";
            return `<button type="button" class="cmd-layer-pill${onClass}" data-layer="${esc(id)}"${dis}>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${l.icon}</svg>
              ${esc(l.label)}
              ${tip}
            </button>`;
          })
          .join("");
      }

      function toggleLayer(id) {
        const layer = layerRegistry[id];
        if (!layer || layer.disabled) return;
        layer.isActive = !layer.isActive;
        if (layer.isActive) layer.render();
        else layer.clear();
        storeActiveLayers();
        renderLayerBar();
      }

      function setupLayerBar() {
        const bar = $("cmd-layer-bar");
        if (!bar) return;
        bar.addEventListener("click", (e) => {
          const pill = e.target.closest("[data-layer]");
          if (!pill) return;
          const id = pill.dataset.layer;
          if (layerRegistry[id]?.disabled) return;
          toggleLayer(id);
        });
      }

      // ── PR 49: floating panel collapse persistence ──
      function setupPanel(panelId, storageKey) {
        const panel = $(panelId);
        if (!panel) return;
        const stored = localStorage.getItem(storageKey);
        if (stored === "true") panel.dataset.collapsed = "true";
        const collapseBtn = panel.querySelector(".cmd-panel-collapse");
        const railBtn = panel.querySelector(".cmd-panel-rail");
        if (collapseBtn) {
          collapseBtn.addEventListener("click", () => {
            panel.dataset.collapsed = "true";
            localStorage.setItem(storageKey, "true");
            if (mapState.map) setTimeout(() => mapState.map.invalidateSize(), 220);
          });
        }
        if (railBtn) {
          railBtn.addEventListener("click", () => {
            panel.dataset.collapsed = "false";
            localStorage.setItem(storageKey, "false");
            if (mapState.map) setTimeout(() => mapState.map.invalidateSize(), 220);
          });
        }
      }

      // ── PR 49: Map | Pipeline view switcher ──
      function setActiveView(view) {
        const isPipeline = view === "pipeline";
        $("pipeline-view").classList.toggle("hidden", !isPipeline);
        document.querySelectorAll(".cmd-viewswitch button").forEach((b) =>
          b.classList.toggle("on", b.dataset.view === view)
        );
        localStorage.setItem(VIEW_KEY, view);
        // When returning to the map, Leaflet may need a size recompute
        // because the container was display:none-adjacent for the duration.
        if (!isPipeline && mapState.map) {
          setTimeout(() => mapState.map.invalidateSize(), 50);
        }
      }
      function setupViewSwitch() {
        document.querySelectorAll(".cmd-viewswitch button").forEach((b) =>
          b.addEventListener("click", () => setActiveView(b.dataset.view))
        );
        const stored = localStorage.getItem(VIEW_KEY);
        setActiveView(stored === "pipeline" ? "pipeline" : "map");
      }

      // Mobile drawer buttons (top bar)
      function setupDrawerToggles() {
        const left = $("cmd-panel-left");
        const right = $("cmd-panel-right");
        const lt = $("cmd-drawer-toggle-left");
        const rt = $("cmd-drawer-toggle-right");
        if (lt && left) lt.addEventListener("click", () => left.classList.toggle("open"));
        if (rt && right) rt.addEventListener("click", () => right.classList.toggle("open"));
      }

      function setupMap() {
        if (mapState.map || !window.L) return;
        const el = $("leads-map");
        if (!el) return;
        const map = L.map(el, {
          zoomControl: true,
          attributionControl: true,
          inertia: true,
          inertiaDeceleration: 3000,
          worldCopyJump: true,
          zoomSnap: 0.25,
          zoomDelta: 0.5,
          scrollWheelZoom: true,
          maxBounds: [
            [49.5, -8.5],
            [61, 2],
          ],
          maxBoundsViscosity: 0.7,
        }).setView([54.5, -3.0], 6);

        // CartoDB Positron greyscale tiles — quieter base map that lets the
        // status-coloured dots carry the visual weight. {r} resolves to '@2x'
        // on hi-DPI screens.
        L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png", {
          maxZoom: 19,
          attribution:
            '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors, © <a href="https://carto.com/attributions">CARTO</a>',
          subdomains: "abcd",
          crossOrigin: true,
        }).addTo(map);

        const cluster = L.markerClusterGroup({
          showCoverageOnHover: false,
          spiderfyOnMaxZoom: true,
          maxClusterRadius: 40,
        });
        map.addLayer(cluster);

        mapState.map = map;
        mapState.cluster = cluster;

        // Initial sizing pass once the pane has dimensions
        setTimeout(() => map.invalidateSize(), 50);
      }

      function buildMarker(lead) {
        const color = statusColour(lead.status || "new");
        const marker = L.circleMarker([lead.venue_lat, lead.venue_lng], {
          radius: 8,
          weight: 1,
          color: "#0a0e14",
          fillColor: color,
          fillOpacity: 0.85,
        });
        const meta = [
          lead.status,
          lead.venue_type ? lead.venue_type.replace(/_/g, " ") : null,
          lead.venue_postcode || null,
        ]
          .filter(Boolean)
          .join(" · ");
        marker.bindPopup(
          `<div class="pop-name">${escapeHtmlAttr(lead.name || "(no name)")}</div>` +
            (meta ? `<div class="pop-meta">${escapeHtmlAttr(meta)}</div>` : "")
        );
        marker.on("click", () => {
          openLeadModalById(lead.id);
        });
        return marker;
      }

      function escapeHtmlAttr(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      async function openLeadModalById(id) {
        let lead = leads.find((l) => l.id === id);
        if (!lead) {
          // Map data can include leads not yet in the kanban cache (e.g. a
          // recently inserted lead). Fall through to a one-row fetch.
          const { data } = await sb
            .from("starbot_leads")
            .select("*")
            .eq("id", id)
            .maybeSingle();
          if (!data) return;
          lead = data;
          leads.unshift(data);
        }
        openModal(lead);
      }

      function leadMatchesFilters(lead) {
        const s = mapState.filters.status;
        if (s.size > 0 && !s.has(lead.status || "new")) return false;
        const v = mapState.filters.venueType;
        if (lead.venue_type && v.size > 0 && !v.has(lead.venue_type)) return false;
        if (mapState.filters.campaign && lead.utm_campaign !== mapState.filters.campaign) {
          return false;
        }
        const q = mapState.filters.search.trim().toLowerCase();
        if (q) {
          const hay = `${lead.name || ""} ${lead.phone || ""}`.toLowerCase();
          if (!hay.includes(q)) return false;
        }
        return true;
      }

      function renderMarkers() {
        if (!mapState.cluster) return;
        mapState.cluster.clearLayers();
        mapState.markers.clear();
        // Skip painting if the Leads layer is toggled off
        if (!layerRegistry.leads.isActive) return;
        for (const lead of mapState.geoLeads) {
          if (!leadMatchesFilters(lead)) continue;
          const m = buildMarker(lead);
          mapState.markers.set(lead.id, m);
          mapState.cluster.addLayer(m);
        }
      }

      function renderNoLocation() {
        const list = $("needs-location-list");
        const count = $("needs-location-count");
        if (!list || !count) return;
        const filtered = mapState.noLocationLeads.filter((l) => leadMatchesFilters(l));
        count.textContent = filtered.length;
        if (filtered.length === 0) {
          list.innerHTML =
            '<div class="needs-empty">All located. New leads without a postcode will appear here.</div>';
          return;
        }
        list.innerHTML = filtered
          .map((l) => {
            const status = l.venue_geocode_status || "no_postcode";
            return `<div class="needs-row" data-id="${escapeHtmlAttr(l.id)}">
              <div class="name">${escapeHtmlAttr(l.name || "(no name)")}
                <span class="needs-status-pill needs-status-${status}">${status.replace("_", " ")}</span>
              </div>
              <div class="meta">${escapeHtmlAttr([l.venue_type ? l.venue_type.replace(/_/g, " ") : null, l.status, l.venue_postcode || null].filter(Boolean).join(" · "))}</div>
            </div>`;
          })
          .join("");
        list.querySelectorAll(".needs-row").forEach((row) => {
          row.addEventListener("click", () => openLeadModalById(row.dataset.id));
        });
      }

      async function fetchGeoLeads() {
        try {
          const r = await fetch("/api/leads/geo", { cache: "no-store" });
          if (!r.ok) throw new Error(`geo ${r.status}`);
          const body = await r.json();
          mapState.geoLeads = body.leads || [];
        } catch (err) {
          console.error("fetchGeoLeads", err);
          mapState.geoLeads = [];
        }
      }

      async function fetchNoLocationLeads() {
        try {
          const r = await fetch("/api/leads/no-location", { cache: "no-store" });
          if (!r.ok) throw new Error(`no-location ${r.status}`);
          const body = await r.json();
          mapState.noLocationLeads = body.leads || [];
        } catch (err) {
          console.error("fetchNoLocationLeads", err);
          mapState.noLocationLeads = [];
        }
      }

      async function refreshMapData() {
        await Promise.all([fetchGeoLeads(), fetchNoLocationLeads()]);
        rebuildCampaignOptions();
        renderMarkers();
        renderNoLocation();
      }

      function rebuildCampaignOptions() {
        const sel = $("map-filter-campaign");
        if (!sel) return;
        const current = sel.value;
        const seen = new Set();
        for (const l of [...mapState.geoLeads, ...mapState.noLocationLeads]) {
          if (l.utm_campaign) seen.add(l.utm_campaign);
        }
        const sorted = [...seen].sort((a, b) => a.localeCompare(b));
        sel.innerHTML = '<option value="">Any campaign</option>' +
          sorted.map((c) => `<option value="${escapeHtmlAttr(c)}">${escapeHtmlAttr(c)}</option>`).join("");
        if (current && sorted.includes(current)) sel.value = current;
      }

      // Generic multi-select popover wired by id. Calls onChange after each tick.
      function setupMulti(rootId, label, allValues, selectedSet, onChange) {
        const root = $(rootId);
        if (!root) return;
        const toggle = root.querySelector(".multi-toggle");
        let menu = null;
        const updateLabel = () => {
          if (selectedSet.size === 0 || selectedSet.size === allValues.length) {
            toggle.textContent = `All ${label}`;
          } else if (selectedSet.size === 1) {
            toggle.textContent = [...selectedSet][0].replace(/_/g, " ");
          } else {
            toggle.textContent = `${selectedSet.size} ${label}`;
          }
        };
        updateLabel();

        const closeMenu = () => {
          if (menu) {
            menu.remove();
            menu = null;
            document.removeEventListener("click", outsideClick, true);
          }
        };
        const outsideClick = (e) => {
          if (menu && !menu.contains(e.target) && e.target !== toggle) closeMenu();
        };
        toggle.addEventListener("click", () => {
          if (menu) { closeMenu(); return; }
          menu = document.createElement("div");
          menu.className = "multi-menu";
          menu.innerHTML = allValues
            .map((v) => `<label class="opt"><input type="checkbox" value="${escapeHtmlAttr(v)}"${selectedSet.has(v) ? " checked" : ""}/><span>${escapeHtmlAttr(v.replace(/_/g, " "))}</span></label>`)
            .join("");
          menu.addEventListener("change", (e) => {
            const cb = e.target;
            if (cb && cb.matches('input[type="checkbox"]')) {
              if (cb.checked) selectedSet.add(cb.value);
              else selectedSet.delete(cb.value);
              updateLabel();
              onChange();
            }
          });
          root.appendChild(menu);
          setTimeout(() => document.addEventListener("click", outsideClick, true), 0);
        });
      }

      function setupFilters() {
        const refresh = () => {
          renderMarkers();
          renderNoLocation();
        };
        setupMulti("map-filter-status", "statuses",
          ["new", "contacted", "interested", "negotiating", "won", "lost"],
          mapState.filters.status, refresh);
        setupMulti("map-filter-venue", "venue",
          VENUE_TYPES, mapState.filters.venueType, refresh);
        const camp = $("map-filter-campaign");
        if (camp) camp.addEventListener("change", () => {
          mapState.filters.campaign = camp.value;
          refresh();
        });
        const search = $("map-filter-search");
        if (search) search.addEventListener("input", () => {
          mapState.filters.search = search.value || "";
          refresh();
        });
        const reset = $("map-filter-reset");
        if (reset) reset.addEventListener("click", () => {
          mapState.filters.status = new Set(ACTIVE_STATUSES);
          mapState.filters.venueType = new Set(VENUE_TYPES);
          mapState.filters.campaign = "";
          mapState.filters.search = "";
          if (camp) camp.value = "";
          if (search) search.value = "";
          // Re-paint the multi-toggle labels
          document.querySelectorAll(".multi-pop .multi-toggle").forEach((t) => {
            const root = t.parentElement;
            if (root.id === "map-filter-status") t.textContent = "All statuses";
            if (root.id === "map-filter-venue") t.textContent = "All venue";
          });
          refresh();
        });
      }

      function setupPostcodeForm() {
        const wrap = $("modal-postcode");
        const input = $("modal-postcode-input");
        const btn = $("modal-postcode-save");
        const status = $("modal-postcode-status");
        if (!wrap || !input || !btn) return;

        const setStatus = (kind, text) => {
          status.className = "status" + (kind ? " " + kind : "");
          status.textContent = text || "";
        };

        btn.addEventListener("click", async () => {
          if (!currentLead) return;
          const postcode = (input.value || "").trim();
          if (!postcode) {
            setStatus("failed", "Enter a postcode");
            return;
          }
          btn.disabled = true;
          setStatus("pending", "Locating…");
          try {
            const r = await fetch(`/api/leads/${encodeURIComponent(currentLead.id)}/postcode`, {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ postcode }),
            });
            if (!r.ok) {
              const body = await r.json().catch(() => ({}));
              if (r.status === 502) setStatus("failed", "Geocoder unavailable");
              else setStatus("failed", body.error || "Failed");
              return;
            }
            const result = await r.json();
            const ok = result.venue_geocode_status === "success";
            setStatus(ok ? "success" : "failed",
              ok ? "Located" : "Not found");
            Object.assign(currentLead, result);
            await refreshMapData();
            updatePostcodeFormForLead(currentLead);
          } catch (err) {
            console.error("postcode save", err);
            setStatus("failed", "Network error");
          } finally {
            btn.disabled = false;
          }
        });
      }

      // The modal calls this whenever it shows a lead, so the postcode input
      // reflects whatever state that lead is in (success / failed / pending /
      // no_postcode). Wraps the existing openModal call site without forking it.
      function updatePostcodeFormForLead(lead) {
        const wrap = $("modal-postcode");
        const input = $("modal-postcode-input");
        const status = $("modal-postcode-status");
        if (!wrap || !input || !status) return;
        // Always visible — manager may want to correct an existing postcode.
        wrap.hidden = false;
        input.value = lead.venue_postcode || "";
        const s = lead.venue_geocode_status || "no_postcode";
        status.className = "status " + (s === "success" ? "success" : s === "failed" ? "failed" : s === "pending" ? "pending" : "");
        status.textContent = s === "success"
          ? "Located"
          : s === "failed"
          ? "Not found"
          : s === "pending"
          ? "Pending"
          : "";
      }

      // Hook into the existing openModal so the postcode form follows the
      // currently shown lead. We wrap rather than edit to keep diff small.
      const _origOpenModal = openModal;
      openModal = function (lead) {
        _origOpenModal(lead);
        updatePostcodeFormForLead(lead);
      };

      async function initMapView() {
        // PR 49: command-dashboard layout setup. Map is full-bleed so we
        // don't need the old split-pane height calc; we just init Leaflet
        // and let CSS position:fixed do the work.
        loadStoredLayers();
        renderLayerBar();
        setupLayerBar();
        setupPanel("cmd-panel-left", LEFT_PANEL_KEY);
        setupPanel("cmd-panel-right", RIGHT_PANEL_KEY);
        setupViewSwitch();
        setupDrawerToggles();
        setupMap();
        setupFilters();
        setupPostcodeForm();
        await refreshMapData();
        // Apply stored layer activation in case any non-default state landed
        for (const id of Object.keys(layerRegistry)) {
          const l = layerRegistry[id];
          if (l.disabled) continue;
          if (l.isActive) l.render();
          else l.clear();
        }
      }

      // ── Boot ──
      (async () => {
        await init();
        // Map view requires the dashboard to be visible (post-auth). Wait
        // until #dashboard loses .hidden before initialising Leaflet so the
        // map container has real dimensions.
        const dash = $("dashboard");
        if (dash && dash.classList.contains("hidden")) {
          const obs = new MutationObserver(() => {
            if (!dash.classList.contains("hidden")) {
              obs.disconnect();
              initMapView();
            }
          });
          obs.observe(dash, { attributes: true, attributeFilter: ["class"] });
        } else {
          initMapView();
        }
      })();
    </script>
  </body>
</html>
